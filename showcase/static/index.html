<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laya · vetrina API decisionale</title>
<style>
  @font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-400.ttf") format("truetype");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-500.ttf") format("truetype");font-weight:500;font-style:normal;font-display:swap}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-600.ttf") format("truetype");font-weight:600;font-style:normal;font-display:swap}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains-mono-700.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
  @font-face{font-family:"Play";src:url("fonts/play-700.ttf") format("truetype");font-weight:700;font-style:normal;font-display:swap}
  :root{
    --bg:#0b1118;--fg:#f4fbff;--muted:rgba(192,252,255,.56);--dim:rgba(192,252,255,.12);
    --green:#b8ff00;--amber:#00f0ff;--red:#ff6b6b;--cyan:#00f0ff;--soft-blue:#c0fcff;
    --card:linear-gradient(180deg, rgba(20,29,39,.94), rgba(17,25,34,.9))
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.55 "JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.03em;padding:28px}
  .wrap{max-width:1040px;margin:0 auto}
  header{border-bottom:1px solid var(--dim);padding-bottom:14px;margin-bottom:8px}
  .term-chrome{display:flex;align-items:center;gap:8px;margin-bottom:16px}
  .term-chrome i{width:11px;height:11px;border-radius:50%;background:#2c3a4b;display:block}
  .term-chrome i:nth-child(1){background:#ff5f57}
  .term-chrome i:nth-child(2){background:#febc2e}
  .term-chrome i:nth-child(3){background:#28c840}
  .term-chrome span{margin-left:6px;color:var(--muted);font-size:11px;letter-spacing:.04em}
  h1{font-family:"Play",sans-serif;font-size:20px;font-weight:700;letter-spacing:.15em;margin:0}
  .sub{color:var(--muted);font-size:12px;margin-top:6px}
  .sub b{color:var(--cyan);font-weight:500}
  .card{background:var(--card);border:1px solid var(--dim);border-radius:20px;box-shadow:0 10px 24px rgba(5,10,18,.18);padding:18px 20px;margin-top:20px}
  .card.build{border-color:var(--cyan)}
  .card h2{font-size:15px;font-weight:600;color:var(--green);margin:0 0 3px}
  .card.build h2{color:var(--cyan)}
  .blurb{color:var(--muted);font-size:12px;margin-bottom:12px}
  textarea{width:100%;background:#0a0e14;color:var(--fg);border:1px solid #ffffff1c;border-radius:4px;
    font:inherit;padding:9px 11px;resize:none;overflow:hidden;min-height:44px}
  textarea:focus,input[type=text]:focus,select:focus{outline:none;border-color:var(--cyan);box-shadow:0 0 0 3px rgba(0,240,255,.1)}
  input[type=text]{background:#0a0e14;color:var(--fg);border:1px solid #ffffff1c;border-radius:4px;font:inherit;padding:6px 9px}
  select{background:#0a0e14;color:var(--fg);border:1px solid #ffffff1c;border-radius:4px;font:inherit;padding:6px 9px}
  .qtags{margin:10px 0;display:flex;flex-wrap:wrap;gap:6px}
  .qtag{font-size:11px;color:var(--muted);border:1px solid var(--dim);border-radius:999px;padding:2px 9px}
  .qtag b{color:var(--fg);font-weight:500}
  .run{background:var(--green);color:#161f2a;border:none;border-radius:999px;padding:7px 16px;font:inherit;
    font-weight:600;cursor:pointer;letter-spacing:.05em;transition:background-color 160ms ease,transform 160ms ease}
  .run:hover:not(:disabled){background:#d4ff58;transform:translateY(-1px)}
  .run:disabled{opacity:.5;cursor:default}
  .ghost{background:transparent;color:var(--cyan);border:1px solid var(--dim);border-radius:999px;padding:6px 12px;
    font:inherit;cursor:pointer;transition:color 160ms ease,border-color 160ms ease}
  .ghost:hover{border-color:rgba(0,240,255,.55);color:var(--cyan)}
  .meta{color:var(--muted);font-size:11px;margin-left:12px}
  .answers{margin-top:14px;display:grid;gap:12px}
  .ans{border-top:1px solid var(--dim);padding-top:10px}
  .ans .name{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}
  .ans .verdict{font-size:16px;margin-top:2px}
  .choice-row{display:grid;grid-template-columns:150px 1fr 44px;align-items:center;gap:8px;margin:3px 0;font-size:12px}
  .choice-row.sel{color:var(--green)}
  .bar{height:9px;background:var(--dim);border-radius:1px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--muted);width:0}
  .choice-row.sel .bar>i{background:var(--green)}
  .gauge{height:9px;background:var(--dim);border-radius:1px;overflow:hidden;max-width:280px}
  .gauge>i{display:block;height:100%;width:0}
  .val{text-align:right;font-variant-numeric:tabular-nums}
  .err{color:var(--red);font-size:12px;margin-top:10px}
  .qbuild{border:1px solid var(--dim);border-radius:12px;padding:12px;margin:10px 0}
  .qbuild .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
  .qbuild label{color:var(--muted);font-size:11px}
  .qbuild .rm{background:transparent;border:none;color:var(--red);cursor:pointer;font:inherit;margin-left:auto}
  .hint{color:var(--muted);font-size:11px;margin:2px 0 6px}
  .modelpick{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:11px;color:var(--muted)}
  .modelpick select{font:inherit;letter-spacing:inherit;color:var(--fg);background:transparent;border:1px solid var(--dim);border-radius:6px;padding:4px 10px;cursor:pointer}
  .modelpick select option{background:var(--bg);color:var(--fg)}
  footer{color:var(--muted);font-size:11px;margin-top:28px;border-top:1px solid var(--dim);padding-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="term-chrome"><i></i><i></i><i></i><span>laya — ~/showcase</span></div>
    <h1>LAYA · API DECISIONALE</h1>
    <div class="sub">Decisioni tipizzate System-1 in un solo passaggio · <b id="engine">connessione…</b> · zero token in uscita</div>
    <label class="modelpick">MODELLO <select id="model" disabled></select>
      <span>un solo modello in memoria: cambiarlo lo ricarica (anche per il serpente)</span></label>
  </header>
  <div id="cards"></div>
  <footer>Ogni scheda invia <code>{state, questions}</code> a <code>/v1/systemone</code>. choice · score · noul — nessuna generazione di testo.</footer>
</div>

<script>
const MODEL_IT = {multilingual:"multilingue"};
const modelName = m => MODEL_IT[m] || m;
const $ = (t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

// Grow a textarea to fit its content so the prompt never shows a scrollbar.
function autoGrow(ta){
  const fit=()=>{ta.style.height="auto";ta.style.height=(ta.scrollHeight+2)+"px";};
  ta.addEventListener("input",fit);
  requestAnimationFrame(fit);
  return ta;
}

function qtags(questions){
  const wrap=$("div","qtags");
  for(const [k,q] of Object.entries(questions)){
    const t=$("span","qtag");t.innerHTML=`<b>${k}</b> · ${q.type}`;wrap.appendChild(t);
  }
  return wrap;
}
function renderChoice(ans){
  const box=$("div","");
  const probs=ans.probabilities||{};
  for(const [label,p] of Object.entries(probs).sort((a,b)=>b[1]-a[1])){
    const row=$("div","choice-row"+(label===ans.choice?" sel":""));
    row.appendChild($("span","",label));
    const bar=$("div","bar");const i=$("i");i.style.width=(p*100)+"%";bar.appendChild(i);
    row.appendChild(bar);row.appendChild($("span","val",p.toFixed(2)));
    box.appendChild(row);
  }
  return box;
}
function renderScore(ans,q){
  const box=$("div","");
  const crit=(q&&q.criteria)||[];const n=Math.max(1,crit.length-1);const v=ans.score;
  box.appendChild($("div","verdict",(crit[Math.round(v)]||"").split(":")[0]+`  (${v.toFixed(2)})`));
  const g=$("div","gauge");const i=$("i");i.style.background="var(--cyan)";i.style.width=(100*v/n)+"%";g.appendChild(i);
  box.appendChild(g);return box;
}
function renderNoul(ans){
  const box=$("div","");const p=ans.noul;
  box.appendChild($("div","verdict",(p>=0.5?"sì":"no")+`  ${p.toFixed(2)}`));
  const g=$("div","gauge");const i=$("i");i.style.background=p>=0.5?"var(--amber)":"var(--muted)";i.style.width=(p*100)+"%";g.appendChild(i);
  box.appendChild(g);return box;
}

// Shared: POST a server body, render typed answers using the given question map.
async function execute(body, questionsMap, btn, meta, out){
  btn.disabled=true; out.innerHTML=""; meta.textContent="in corso…";
  const t0=performance.now();
  const model=document.getElementById("model").value;
  if(model) body={...body,model};
  try{
    const r=await fetch("/api/run",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(body)});
    const data=await r.json();
    if(!r.ok||data.error){out.appendChild(Object.assign($("div","err"),{textContent:data.error||("HTTP "+r.status)}));meta.textContent="";return;}
    meta.textContent=`${Math.round(performance.now()-t0)} ms · ${data.usage?.input_tokens??"?"} token in ingresso / 0 in uscita · ${data.model?modelName(data.model):"?"}`;
    for(const [k,ans] of Object.entries(data.answers)){
      const a=$("div","ans");a.appendChild($("div","name",k));
      const q=questionsMap[k];
      a.appendChild(ans.type==="choice"?renderChoice(ans):ans.type==="score"?renderScore(ans,q):renderNoul(ans));
      out.appendChild(a);
    }
  }catch(e){out.appendChild(Object.assign($("div","err"),{textContent:String(e)}));meta.textContent="";}
  finally{btn.disabled=false}
}

function exampleCard(ex){
  const card=$("div","card");
  card.appendChild($("h2",null,ex.title));
  card.appendChild($("div","blurb",ex.blurb));
  const ta=autoGrow($("textarea"));ta.value=ex.state;card.appendChild(ta);
  card.appendChild(qtags(ex.questions));
  const btn=$("button","run","Esegui decisione");const meta=$("span","meta","");
  const line=$("div","");line.appendChild(btn);line.appendChild(meta);card.appendChild(line);
  const out=$("div","answers");card.appendChild(out);
  btn.onclick=()=>execute({id:ex.id,state:ta.value}, ex.questions, btn, meta, out);
  return card;
}

// ---- Build-your-own decision ---------------------------------------------
let qseq=0;
function questionEditor(){
  const wrap=$("div","qbuild");
  const row1=$("div","row");
  const name=Object.assign($("input"),{type:"text",placeholder:"nome (es. categoria)",value:"domanda_"+(++qseq)});
  const type=$("select");
  for(const t of ["choice","score","noul"]){const o=$("option",null,t);o.value=t;type.appendChild(o);}
  const rm=$("button","rm","× rimuovi");rm.onclick=()=>wrap.remove();
  row1.append(Object.assign($("label"),{textContent:"campo"}),name,Object.assign($("label"),{textContent:"tipo"}),type,rm);
  wrap.appendChild(row1);
  const instr=Object.assign($("input"),{type:"text",placeholder:"istruzione (es. Quale reparto?)"});
  instr.style.width="100%";instr.style.marginBottom="6px";
  wrap.appendChild(instr);
  const hint=$("div","hint","");
  const crit=autoGrow($("textarea"));
  wrap.appendChild(hint);wrap.appendChild(crit);
  function sync(){
    if(type.value==="choice"){hint.textContent="scelte: una per riga, formato  chiave: descrizione";crit.style.display="";crit.placeholder="fatturazione: pagamenti e rimborsi\ntecnico: bug e guasti\naltro: il resto";}
    else if(type.value==="score"){hint.textContent="livelli ordinati: uno per riga (dal minore al maggiore)";crit.style.display="";crit.placeholder="non urgente\npresto\ncritico";}
    else{hint.textContent="noul: risposta sì/no, nessuna scelta da elencare";crit.style.display="none";}
  }
  type.onchange=sync;sync();
  wrap.build=()=>{
    const q={type:type.value,instructions:instr.value.trim()||"?"};
    const lines=crit.value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(type.value==="choice"){
      q.criteria={};
      for(const ln of lines){const i=ln.indexOf(":");if(i<0){q.criteria[ln]=ln;}else{q.criteria[ln.slice(0,i).trim()]=ln.slice(i+1).trim();}}
    }else if(type.value==="score"){q.criteria=lines;}
    return [name.value.trim()||("campo"+qseq), q];
  };
  return wrap;
}

function builderCard(){
  const card=$("div","card build");
  card.appendChild($("h2",null,"Componi la tua decisione"));
  card.appendChild($("div","blurb","Scrivi un testo, definisci le domande (choice / score / noul) e interroga il modello."));
  const ta=autoGrow($("textarea"));ta.placeholder="Incolla qui il testo da valutare…";
  ta.value="Mi hanno addebitato due volte e nessuno risponde. Voglio disdire subito.";
  card.appendChild(ta);
  const qbox=$("div","");card.appendChild(qbox);
  qbox.appendChild(questionEditor());
  const add=$("button","ghost","+ aggiungi domanda");add.onclick=()=>qbox.appendChild(questionEditor());
  const btn=$("button","run","Esegui decisione");btn.style.marginLeft="10px";
  const meta=$("span","meta","");
  const line=$("div","");line.style.marginTop="10px";line.append(add,btn,meta);card.appendChild(line);
  const out=$("div","answers");card.appendChild(out);
  btn.onclick=()=>{
    const questions={};
    for(const ed of qbox.querySelectorAll(".qbuild")){const [k,q]=ed.build();if(k)questions[k]=q;}
    if(!Object.keys(questions).length){out.innerHTML="";out.appendChild(Object.assign($("div","err"),{textContent:"aggiungi almeno una domanda"}));return;}
    execute({state:ta.value,questions}, questions, btn, meta, out);
  };
  return card;
}

async function main(){
  const examples=await (await fetch("/api/examples")).json();
  const cards=document.getElementById("cards");
  cards.appendChild(builderCard());               // craft-your-own first
  for(const ex of examples) cards.appendChild(exampleCard(ex));
  const engine=document.getElementById("engine"), sel=document.getElementById("model");
  try{
    const m=await (await fetch("/api/models")).json();
    sel.replaceChildren(...m.models.map(x=>new Option(modelName(x.name),x.name)));
    if(m.loaded) sel.value=m.loaded;
    sel.disabled=!m.models.length;
    engine.textContent = m.loaded ? ("modello: "+modelName(m.loaded)) : "Laya API";
  }catch(e){engine.textContent="Laya API";}
  sel.addEventListener("change",()=>{engine.textContent="modello: "+modelName(sel.value);});
}
main();
</script>
</body>
</html>
